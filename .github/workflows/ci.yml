name: CI

# No secrets are used anywhere in this workflow.
#
# In particular the live `python -m sports_quant providers-check` is NOT run
# here: it requires a private Odds API key, and no API key belongs in GitHub
# Actions. Provider behaviour is covered by unit tests that use mocked HTTP
# transports (see `sports_quant/tests/`), so CI exercises the same code paths
# without any credential and without any outbound request.

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only checkout; this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff, mypy, pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy .

      - name: pytest
        # `-rf` prints a short summary of failures, and the JUnit XML is uploaded
        # below so a failure is diagnosable from the run without needing log
        # download permissions. `always()` on the upload matters: the artifact is
        # only interesting when the step failed.
        run: python -m pytest -q -rf --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  wheel-smoke:
    name: Non-editable wheel install smoke (Python 3.11)
    runs-on: ubuntu-latest
    # A separate job that installs the BUILT WHEEL into a clean environment --
    # never an editable install -- so a missing package (e.g. sports_quant.matching)
    # or missing migration SQL fails here even though the editable `checks` job
    # would still pass. No secret is used and no outbound provider request is made.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel (no editable install)
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
          echo "Wheel contents:"
          WORKSPACE="$GITHUB_WORKSPACE" python - "$RUNNER_TEMP/wheelhouse" <<'PY'
          import glob, os, sys, zipfile
          whl = glob.glob(f"{sys.argv[1]}/sports_quant-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          migs = sorted(n.split("/")[-1] for n in names if "/db/migrations/" in n and n.endswith(".sql"))
          assert "sports_quant/matching/sportsbook.py" in names, "matching package missing"
          # Compare against the SOURCE TREE rather than a hard-coded count. This
          # catches a migration that failed to package no matter how many exist,
          # and it does not need editing every time one is added -- a pinned
          # literal here only ever reports "the number changed", which is not the
          # thing we care about.
          src = sorted(os.path.basename(p) for p in glob.glob(
              os.path.join(os.environ["WORKSPACE"], "sports_quant", "db", "migrations", "*.sql")))
          assert src, "no migrations found in the source tree"
          assert migs == src, {"missing_from_wheel": sorted(set(src) - set(migs)),
                               "extra_in_wheel": sorted(set(migs) - set(src))}
          assert migs[0] == "a001_core_entities.sql", migs[0]
          assert {"e017_provider_identity.sql", "f018_retrospective_provenance.sql"} <= set(migs), migs
          assert not any("/tests/" in n for n in names), "tests packaged"
          assert not any(n.lower().endswith((".env", ".db")) for n in names), "secret/db packaged"
          print("wheel OK:", len(migs), "migrations, matching package present")
          PY

      - name: Install the wheel into a clean, non-editable environment
        run: |
          python -m venv "$RUNNER_TEMP/smokeenv"
          "$RUNNER_TEMP/smokeenv/bin/python" -m pip install --upgrade pip
          WHEEL="$(ls "$RUNNER_TEMP"/wheelhouse/sports_quant-*.whl)"
          "$RUNNER_TEMP/smokeenv/bin/python" -m pip install "$WHEEL"

      - name: Import, CLI, and db-init from the installed wheel (outside the source tree)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/smokeenv/bin/python"
          REPO="$GITHUB_WORKSPACE" "$PY" - <<'PY'
          import os
          import sports_quant, sports_quant.matching, sports_quant.matching.sportsbook, sports_quant.db.engine
          repo = os.path.abspath(os.environ["REPO"])
          for m in (sports_quant, sports_quant.matching, sports_quant.matching.sportsbook, sports_quant.db.engine):
              f = os.path.abspath(m.__file__)
              assert "site-packages" in f and not f.startswith(repo), f"{m.__name__} not from wheel: {f}"
          from sports_quant.db.engine import discover_migrations
          from sports_quant.db.schema import CURRENT_SCHEMA_VERSION
          migs = discover_migrations()
          # The declared version and the packaged sequence must agree, and the
          # sequence must be contiguous from 1. That is the real invariant; a
          # pinned count would only tell us a migration was added.
          assert len(migs) == CURRENT_SCHEMA_VERSION, (len(migs), CURRENT_SCHEMA_VERSION)
          assert [m.version for m in migs] == list(range(1, CURRENT_SCHEMA_VERSION + 1))
          print("imports + migrations resolve from the installed wheel:",
                len(migs), "migrations, last is", migs[-1].name)
          PY
          "$RUNNER_TEMP/smokeenv/bin/sports-quant" --help >/dev/null
          "$PY" -m sports_quant db-init --db "$RUNNER_TEMP/smoke.db" | tee /tmp/init1.txt
          "$PY" -m sports_quant db-init --db "$RUNNER_TEMP/smoke.db" | tee /tmp/init2.txt
          EXPECTED_VERSION="$("$PY" -c 'from sports_quant.db.schema import CURRENT_SCHEMA_VERSION as v; print(v)')"
          grep -q "Schema version: $EXPECTED_VERSION" /tmp/init1.txt
          grep -q "nothing was changed" /tmp/init2.txt

      - name: TEAM-A attestation invariants (RV1/RV3/RV5, offline, synthetic only)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          # The RV1 detective control is a CODE+CI invariant, not a DB constraint:
          # SQLite cannot read the committed map, so it cannot reject a crosswalk
          # that contradicts it. This step proves the verifier actually catches
          # such a row. It uses only the fresh smoke database seeded above and a
          # synthetic corpus -- NO protected F1 corpus is required or touched, and
          # no provider request is made.
          PY="$RUNNER_TEMP/smokeenv/bin/python"
          SQ="$RUNNER_TEMP/smokeenv/bin/sports-quant"

          # 1. Map invariants alone must pass with no database at all.
          "$SQ" team-attestation-verify --json | tee /tmp/attest.json
          # The report is passed by PATH, not on stdin: a heredoc already owns
          # stdin here, so a `< file` redirect would be silently discarded.
          REPORT=/tmp/attest.json "$PY" - <<'PY'
          import json, os
          with open(os.environ["REPORT"], encoding="utf-8") as fh:
              p = json.load(fh)
          assert p["network_occurred"] is False, p
          assert p["map_format_version"] == "team-a-map-v1", p
          assert p["attestation_policy_version"] == "g5-team-attestation-v1", p
          # Pinned so a silent edit to the map or to the canonical franchise seed
          # changes CI, not just a corpus that nobody rebuilds.
          assert p["canonical_team_seed_digest"] == (
              "19d7e98d239a582c8968fbe819fb6926"
              "b60f8a568ef56a71e134e7e74d6a7fcc"), p["canonical_team_seed_digest"]
          assert p["attestation_map_digest"] == (
              "ae21c26b7ca642755dbf6d2f5e4aeee1"
              "ae4c169889670f730ff40aa031d290d9"), p["attestation_map_digest"]
          assert p["map_shape"]["entries"] == 60, p["map_shape"]
          print("map invariants pinned:", p["map_shape"]["entries_by_league"])
          PY

          # 2. RV5: every canonical target the map names must exist in the
          #    freshly seeded canonical `teams` dimension.
          DB="$RUNNER_TEMP/smoke.db" "$PY" - <<'PY'
          import os, sqlite3
          from sports_quant.retrospective.attestations import TEAM_ATTESTATIONS
          conn = sqlite3.connect(os.environ["DB"])
          have = {r[0] for r in conn.execute("SELECT team_id FROM teams")}
          missing = sorted({e.canonical_team_id for e in TEAM_ATTESTATIONS} - have)
          assert not missing, f"attested canonical teams absent from the seed: {missing}"
          print(f"RV5 OK: {len(TEAM_ATTESTATIONS)} attestations resolve into {len(have)} seeded teams")
          PY

          # 3. RV1: an honest crosswalk must verify clean, and a row that
          #    satisfies every v19 constraint -- real ACCEPTED audit, real corpus,
          #    real canonical team -- but contradicts the committed map must be
          #    REPORTED, with the command exiting non-zero.
          cp "$RUNNER_TEMP/smoke.db" "$RUNNER_TEMP/attest.db"
          DB="$RUNNER_TEMP/attest.db" "$PY" - <<'PY'
          import os
          from sports_quant.db.engine import Database, transaction
          from sports_quant.db.repositories.retrospective import (
              SqliteRetrospectiveProvenanceRepository)
          from sports_quant.db.schema import utc_now_iso
          from sports_quant.retrospective.attestations import (
              TEAM_ATTESTATION_POLICY_VERSION, attestation_map_digest,
              attested_canonical_team)
          from sports_quant.retrospective.provenance import (
              AuditVerdict, EntityType, G1Variant, ProvenanceClass, ProviderNamespace)
          from sports_quant.retrospective.verifier import verify_corpus

          ns = ProviderNamespace("lg_mlb", "mlb_statsapi", EntityType.TEAM, "v1")
          DIGEST, now = "src-digest-ci", utc_now_iso()
          with Database(os.environ["DB"]).connection() as conn:
              with transaction(conn):
                  repo = SqliteRetrospectiveProvenanceRepository(conn)
                  corpus = repo.record_corpus_version(
                      provenance_class=ProvenanceClass.RECONSTRUCTED_RESEARCH,
                      league_id="lg_mlb", reconstruction_policy_version="ci",
                      cutoff_policy_id="cp_ci", cutoff_policy_version="v1",
                      source_corpus_digest=DIGEST, target_set_digest="t",
                      g1_variant=G1Variant.G1_B_CORE,
                      static_identity_map_digest=attestation_map_digest(),
                      code_version="ci")
                  audit = repo.record_identity_audit(
                      namespace=ns, source_corpus_digest=DIGEST,
                      audit_policy_version="ci", distinct_ids=2,
                      total_observations=4, collision_count=0,
                      verdict=AuditVerdict.ACCEPTED)
                  # A) An honest crosswalk, written as the TEAM-A path writes it.
                  repo.record_static_crosswalk(
                      corpus_version_id=corpus.corpus_version_id, namespace=ns,
                      provider_id="147",
                      canonical_entity_id=attested_canonical_team(ns, "147"),
                      identity_audit_id=audit.identity_audit_id,
                      provenance_policy_version=TEAM_ATTESTATION_POLICY_VERSION,
                      attestation_map_digest=attestation_map_digest())
              clean = verify_corpus(conn, corpus.corpus_version_id)
              assert clean.ok and clean.checked == 1, clean.as_json()
              print("honest crosswalk verified clean")

              # B) 108 is the Angels in the committed map; bind it to Houston.
              with transaction(conn):
                  conn.execute(
                      "INSERT INTO static_crosswalk_provenance (crosswalk_id, "
                      "corpus_version_id, league_id, provider, namespace_generation, "
                      "entity_type, provider_id, canonical_entity_id, "
                      "identity_audit_id, identity_audit_digest, "
                      "provenance_policy_version, semantic_digest, curated_at, "
                      "created_at) VALUES ('xwk_ci_planted',?,'lg_mlb',"
                      "'mlb_statsapi','v1','team','108','tm_mlb_hou',?,?,?,"
                      "'digest_ci',?,?)",
                      (corpus.corpus_version_id, audit.identity_audit_id,
                       audit.semantic_digest, TEAM_ATTESTATION_POLICY_VERSION,
                       now, now))
          print("planted a v19-valid crosswalk that contradicts the committed map")
          PY
          set +e
          "$SQ" team-attestation-verify --db "$RUNNER_TEMP/attest.db" --json >/tmp/bad.json
          rc=$?
          set -e
          cat /tmp/bad.json
          test "$rc" -ne 0 || { echo "verifier accepted a contradicting crosswalk"; exit 1; }
          grep -q "committed map says" /tmp/bad.json \
            || { echo "verifier did not name the contradiction"; exit 1; }
          echo "RV1 OK: the contradicting crosswalk was detected and exited $rc"

      - name: TEAM-A review repairs (dry-run parity, game provenance, convergence)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          # The defects the independent review of 982b73b proved and repaired.
          # Synthetic evidence only: no protected corpus, no provider request.
          "$RUNNER_TEMP/smokeenv/bin/python" - <<'PY'
          """CI part 4: the repairs proven by the independent review of 982b73b.

          Team apply + dry-run parity, game apply + dry-run parity, persisted game-audit
          provenance, bare/qualified convergence, and both verifier detections. Uses only
          synthetic evidence in a scratch directory; no protected corpus, no network.
          """

          import os
          import socket
          import sqlite3
          import tempfile
          from pathlib import Path


          def _boom(*a, **k):
              raise AssertionError("TEAM-A CI check attempted network access")


          socket.getaddrinfo = _boom
          socket.create_connection = _boom

          from sports_quant.db.engine import Database, transaction
          from sports_quant.db.init import initialize_database
          from sports_quant.db.schema import utc_now_iso
          from sports_quant.retrospective.game_bootstrap import write_game_bootstrap
          from sports_quant.retrospective.provenance import EntityType
          from sports_quant.retrospective.runner import run_identity_audit
          from sports_quant.retrospective.verifier import verify_corpus

          TS = "2026-06-01T00:00:00.000000Z"
          TEAMS = {"108": ("Los Angeles Angels", "LAA", "Los Angeles", "Angels"),
                   "117": ("Houston Astros", "HOU", "Houston", "Astros"),
                   "147": ("New York Yankees", "NYY", "New York", "Yankees")}

          tmp = Path(tempfile.mkdtemp(prefix="team_a_ci_"))
          src, out = tmp / "source.db", tmp / "out.db"
          initialize_database(src)
          initialize_database(out)

          conn = sqlite3.connect(src)
          conn.execute("PRAGMA foreign_keys = OFF")
          n = 0
          for pid, (name, abbr, city, nick) in TEAMS.items():
              n += 1
              conn.execute(
                  "INSERT INTO provider_team_identity_snapshots (identity_id, provider, "
                  "provider_team_id, league_id, full_name, normalized_name, abbreviation, "
                  "city, nickname, observed_at, raw_response_id, raw_response_hash, "
                  "content_hash, created_at) VALUES (?,'mlb_statsapi',?,'lg_mlb',?,?,?,?,?,"
                  "?,'raw','h',?,?)",
                  (f"pti_{n}", pid, name, name.lower(), abbr, city, nick, TS,
                   f"ch_{n}", TS))
          for gid, home, away in (("700001", "147", "117"), ("123", "117", "108")):
              n += 1
              conn.execute(
                  "INSERT INTO game_schedule_snapshots (schedule_id, game_ref_id, provider, "
                  "provider_game_id, season, game_date_local, scheduled_start, "
                  "home_provider_team_id, away_provider_team_id, venue_provider_id, "
                  "mapped_status, game_number, doubleheader_code, reschedule_info, "
                  "observed_at, ingested_at, run_id, raw_response_id, raw_response_hash, "
                  "content_hash, created_at) VALUES (?,?,'mlb_statsapi',?,2026,'2026-06-01',"
                  "'2026-06-01T22:45:00Z',?,?,'1','final',1,'N',NULL,?,?,'run','raw','h',?,?)",
                  (f"gss_{n}", f"pgr_{gid}", gid, home, away, TS, TS, f"ch_{n}", TS))
          conn.commit()
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()

          now = utc_now_iso()
          with Database(out).connection() as c:
              c.execute("BEGIN IMMEDIATE")
              c.execute(
                  "INSERT INTO seasons (season_id, league_id, year, phase, label, "
                  "start_date, end_date, created_at, updated_at) VALUES "
                  "('sn_mlb_2026_regular','lg_mlb',2026,'regular','2026','2026-01-01',"
                  "'2027-12-31',?,?)", (now, now))
              # A canonical game the CONVENTIONAL matcher already created, under the BARE
              # provider string. TEAM-A must converge on it, not mint a second row.
              c.execute(
                  "INSERT INTO games (game_id, league_id, season_id, home_team_id, "
                  "away_team_id, scheduled_start, original_start, game_date_local, "
                  "game_number, is_neutral_site, status, official_provider, "
                  "official_game_key, created_at, updated_at) VALUES "
                  "('gm_conventional','lg_mlb','sn_mlb_2026_regular','tm_mlb_hou',"
                  "'tm_mlb_laa','2026-06-01T22:45:00Z','2026-06-01T22:45:00Z','2026-06-01',"
                  "1,0,'final','mlb_statsapi','123',?,?)", (now, now))
              c.commit()


          def run(entity_type, apply):
              return run_identity_audit(
                  source_db=src, output_db=out, league_id="lg_mlb",
                  provider="mlb_statsapi", namespace_generation="v1",
                  entity_type=entity_type, apply=apply, build_crosswalks=True,
                  code_version="ci")


          # 1. TEAM dry-run must predict apply exactly.
          tdry = run(EntityType.TEAM, False)
          tapp = run(EntityType.TEAM, True)
          assert tdry.team_crosswalks is not None, "TEAM dry run produced no prediction"
          assert tdry.team_crosswalks.written == tapp.team_crosswalks.written == 3
          assert tdry.team_crosswalks.plan.attested == tapp.team_crosswalks.plan.attested
          assert tdry.crosswalk is None and tapp.crosswalk is None
          print("1. TEAM dry-run/apply parity OK: 3 attested, 3 written")

          # 2. GAME dry-run must predict apply exactly, and write game provenance.
          gdry = run(EntityType.GAME, False)
          gapp = run(EntityType.GAME, True)
          assert gdry.game_bootstrap is not None, "GAME dry run produced no prediction"
          assert len(gdry.game_bootstrap.plan.ready) == len(gapp.game_bootstrap.plan.ready)
          assert gdry.game_bootstrap.created == gapp.game_bootstrap.created
          assert gapp.game_bootstrap.provenance_written == 2, gapp.game_bootstrap
          print(f"2. GAME dry-run/apply parity OK: created={gapp.game_bootstrap.created}, "
                f"reused={gapp.game_bootstrap.reused}, "
                f"provenance={gapp.game_bootstrap.provenance_written}")

          # 3. Convergence: the conventionally matched game was reused, not duplicated.
          with Database(out).connection() as c:
              rows = c.execute(
                  "SELECT game_id, official_provider FROM games WHERE official_game_key='123'"
                  ).fetchall()
              assert len(rows) == 1, f"the same real game has {len(rows)} canonical rows"
              assert rows[0][0] == "gm_conventional", rows[0][0]
              assert c.execute(
                  "SELECT COUNT(*) FROM static_crosswalk_provenance WHERE entity_type='game' "
                  "AND canonical_entity_id='gm_conventional'").fetchone()[0] == 1
          print("3. bare/qualified convergence OK: one canonical game, provenance attached")

          # 4. A forged, unpersisted audit must not mint canonical games.
          from sports_quant.retrospective.sources import open_source_corpus

          sconn = open_source_corpus(src)
          try:
              with Database(out).connection() as c:
                  try:
                      with transaction(c):
                          write_game_bootstrap(
                              c, sconn, plan=gapp.plan,
                              corpus_version_id=gapp.corpus_version_id,
                              identity_audit_id="ida_not_a_real_audit")
                  except Exception as exc:
                      assert "audit" in str(exc).lower(), exc
                      print(f"4. forged game audit refused: {str(exc)[:70]}")
                  else:
                      raise AssertionError("a forged audit id minted canonical games")
          finally:
              sconn.close()

          # 5. Verifier: wrong canonical target IS detected.
          with Database(out).connection() as c:
              c.execute("DROP TRIGGER trg_xwk_no_update")
              with transaction(c):
                  c.execute(
                      "UPDATE static_crosswalk_provenance SET canonical_entity_id='tm_mlb_hou' "
                      "WHERE entity_type='team' AND provider_id='147'")
              rep = verify_corpus(c, tapp.corpus_version_id)
              assert not rep.ok and any("committed map says" in p for p in rep.problems), rep
              print(f"5. verifier caught a wrong target: {rep.problems[0][:70]}")

              # 6. Verifier: a tampered semantic digest IS detected.
              with transaction(c):
                  c.execute(
                      "UPDATE static_crosswalk_provenance SET canonical_entity_id='tm_mlb_nyy' "
                      "WHERE entity_type='team' AND provider_id='147'")
                  c.execute(
                      "UPDATE static_crosswalk_provenance SET semantic_digest=? "
                      "WHERE entity_type='team' AND provider_id='147'", ("0" * 64,))
              rep = verify_corpus(c, tapp.corpus_version_id)
              assert not rep.ok and any("digest" in p for p in rep.problems), rep
              print(f"6. verifier caught a tampered digest: {rep.problems[0][:70]}")

          print("TEAM-A review repairs verified from the installed wheel")

          PY

      - name: Checkpoint provenance from the installed wheel (offline, zero network)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/smokeenv/bin/python"
          "$PY" - <<'PY'
          """Legacy load, no-op resume, three-process accounting, partial resume.

          Runs against the WHEEL, outside the source tree, with a zero-network
          sentinel armed: any DNS/socket/httpx use fails the smoke test.
          """
          import json, os, socket, tempfile
          from pathlib import Path

          def _boom(*a, **k):
              raise AssertionError("wheel smoke attempted network access")
          socket.getaddrinfo = _boom
          socket.create_connection = _boom
          import httpx
          httpx.HTTPTransport.handle_request = _boom
          httpx.AsyncHTTPTransport.handle_async_request = _boom

          from sports_quant.db.engine import discover_migrations
          from sports_quant.db.schema import CURRENT_SCHEMA_VERSION, SUPPORTED_SCHEMA_VERSIONS
          # The declared version must be real and must be one the tooling accepts
          # on an existing database -- which is what keeps a preserved checkpoint's
          # recorded manifest valid across an additive migration. A pinned literal
          # would instead fail every time a purely additive migration lands.
          assert CURRENT_SCHEMA_VERSION == len(discover_migrations()), CURRENT_SCHEMA_VERSION
          assert CURRENT_SCHEMA_VERSION in SUPPORTED_SCHEMA_VERSIONS, CURRENT_SCHEMA_VERSION

          from sports_quant.ingest.checkpoint import (
              CHECKPOINT_FORMAT_VERSION, LEGACY_CHECKPOINT_FORMAT_VERSION,
              Checkpoint, load_checkpoint, write_checkpoint)
          from sports_quant.usage_provenance import (
              USAGE_ACCOUNTING_VERSION, combine_usage, current_process_entry,
              validate_usage_accounting)

          tmp = Path(tempfile.mkdtemp())

          # 1. A legacy v1 checkpoint loads and keeps every fact it holds.
          v1 = {
              "checkpoint_format_version": LEGACY_CHECKPOINT_FORMAT_VERSION,
              "plan_version": "p", "manifest_hash": "h", "provider": "mlb_statsapi",
              "league": "mlb", "date_range": "2026-06-01..2026-06-30",
              "families": ["schedule"], "scratch_db": "s.db",
              "scratch_fingerprint": "FP", "schema_version": 17,
              "request_cap": 6002, "credit_cap": None,
              "completed_identities": ["u1"], "state": "completed",
              "usage": {"successful_responses": 1999, "failed_responses": 2,
                        "retry_attempts": 7, "transport_starts": 2008,
                        "reserved_attempts": 2008, "attempted_requests": 2008,
                        "responses_received": 2001, "parse_successes": 1999,
                        "pages_fetched": 401, "throttle_events": 1999,
                        "throttle_wait_seconds": 3407.8885556863097,
                        "families_completed": ["game", "skeleton"],
                        "network_occurred": True, "checkpoint_state": "completed"}}
          p1 = tmp / "legacy.ckpt"
          p1.write_text(json.dumps(v1), encoding="utf-8")
          before = p1.read_bytes()
          ck = load_checkpoint(p1)
          assert ck.checkpoint_format_version == LEGACY_CHECKPOINT_FORMAT_VERSION
          assert ck.legacy_migrated and not ck.process_count_known
          lg = ck.logical_usage()
          assert (lg["successful_responses"], lg["failed_responses"],
                  lg["retry_attempts"], lg["pages_fetched"]) == (1999, 2, 7, 401)
          assert p1.read_bytes() == before, "loading a v1 checkpoint mutated it"
          assert validate_usage_accounting(lg, request_cap=6002) == []

          # 2. A missing legacy counter stays missing (never a misleading zero).
          v1b = dict(v1); v1b["usage"] = {"successful_responses": 5}
          p1b = tmp / "sparse.ckpt"; p1b.write_text(json.dumps(v1b), encoding="utf-8")
          e = load_checkpoint(p1b).process_usage[0]
          assert e["successful_responses"] == 5 and "retry_attempts" not in e

          # 3. Three-process logical accounting: prior + current == total, once.
          procs = [
              {"reserved_attempts": 5, "attempted_requests": 5, "transport_starts": 5,
               "successful_responses": 2, "failed_responses": 2, "retry_attempts": 1,
               "responses_received": 2, "parse_successes": 2, "pages_fetched": 1,
               "network_occurred": True, "families_completed": ["schedule"]},
              {"reserved_attempts": 5, "attempted_requests": 5, "transport_starts": 5,
               "successful_responses": 2, "failed_responses": 1, "retry_attempts": 2,
               "responses_received": 2, "parse_successes": 2, "pages_fetched": 1,
               "network_occurred": True, "families_failed": ["schedule"]},
              {"reserved_attempts": 2, "attempted_requests": 2, "transport_starts": 2,
               "successful_responses": 2, "responses_received": 2,
               "parse_successes": 2, "pages_fetched": 1, "network_occurred": True,
               "checkpoint_state": "completed", "families_completed": ["schedule"]}]
          total = combine_usage(procs)
          assert total["successful_responses"] == 6
          assert total["failed_responses"] == 3, "a later process erased a failure"
          assert total["retry_attempts"] == 3
          assert total["reserved_attempts"] == 12
          assert total["prior_transport_starts"] == 10
          assert tuple(total["families_failed"]) == ("schedule",)
          assert validate_usage_accounting(total, request_cap=50, entries=procs) == []

          # 4. Repeated combination never multiplies prior usage.
          assert combine_usage(procs) == total

          # 5. The gate's prior pre-charge is not attributed to the new process.
          entry = current_process_entry(
              {"reserved_attempts": 30, "attempted_requests": 30,
               "prior_requests": 20, "reserved_credits": 8, "prior_credits": 5})
          assert entry["reserved_attempts"] == 10 and entry["reserved_credits"] == 3

          # 6. A v2 round trip carries the provenance block and refuses a lie.
          ck2 = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, process_usage=list(procs),
              usage=total, state="completed", completed_identities=["u1"])
          p2 = tmp / "v2.ckpt"
          write_checkpoint(p2, ck2)
          body = json.loads(p2.read_text(encoding="utf-8"))
          assert body["checkpoint_format_version"] == CHECKPOINT_FORMAT_VERSION
          assert body["usage_provenance"]["accounting_version"] == USAGE_ACCOUNTING_VERSION
          assert body["usage_provenance"]["process_count"] == 3
          reloaded = load_checkpoint(p2)
          assert reloaded.usage["failed_responses"] == 3
          assert reloaded.prior_usage()["successful_responses"] == 4
          assert reloaded.current_process_usage()["successful_responses"] == 2
          body["usage"]["successful_responses"] = 999
          p2.write_text(json.dumps(body), encoding="utf-8")
          try:
              load_checkpoint(p2)
          except Exception as exc:
              assert "inconsistent" in str(exc), exc
          else:
              raise AssertionError("a checkpoint contradicting its history was accepted")

          # 7. A completed state cannot coexist with an unresolved unit.
          bad = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, state="completed",
              completed_identities=["u1"], incomplete_identities=["u2"])
          p3 = tmp / "bad.ckpt"
          write_checkpoint(p3, bad)
          try:
              load_checkpoint(p3)
          except Exception as exc:
              assert "unresolved" in str(exc), exc
          else:
              raise AssertionError("a completed checkpoint with an unresolved unit loaded")

          # 8. Hostile value types and ranges are refused, not propagated.
          from sports_quant.usage_provenance import (
              LEGACY_PROCESS_ID, PROCESS_ID_KEY, UsageProvenanceError,
              sanitized_usage)
          for field, value in (("successful_responses", "1999"),
                               ("successful_responses", True),
                               ("failed_responses", -1),
                               ("throttle_wait_seconds", float("nan")),
                               ("throttle_wait_seconds", float("inf")),
                               ("pages_fetched", {"a": 1}),
                               ("network_occurred", 1),
                               ("families_completed", "schedule")):
              try:
                  sanitized_usage({field: value})
              except UsageProvenanceError:
                  pass
              else:
                  raise AssertionError(f"hostile {field}={value!r} was accepted")
          assert sanitized_usage({"successful_responses": 1, "api_key": "sk-x"}) == {
              "successful_responses": 1}, "an unknown key survived sanitization"

          # 9. An absent counter stays unknown; it never becomes a misleading zero.
          assert validate_usage_accounting({"successful_responses": 5}) == []
          assert validate_usage_accounting(
              {"successful_responses": 5, "transport_starts": 1})

          # 10. A legacy aggregate keeps its honest marker, and contradictory unit
          #     sets fail closed.
          assert load_checkpoint(p1).process_usage[0][PROCESS_ID_KEY] == LEGACY_PROCESS_ID
          for over, needle in (
                  ({"state": "failed", "failed_identities": ["u1"]}, "both completed"),
                  ({"recovered_identities": ["ghost"]}, "not completed")):
              body = dict(v1)
              body.update(over)
              pv = tmp / "sets.ckpt"
              pv.write_text(json.dumps(body), encoding="utf-8")
              try:
                  load_checkpoint(pv)
              except Exception as exc:
                  assert needle in str(exc), exc
              else:
                  raise AssertionError(f"contradictory unit sets accepted: {over}")

          # 11. FIVE-process logical accounting closes exactly, once per process.
          five = []
          for i in range(5):
              succ, fails, retries = i + 1, i % 2, i % 3
              five.append({
                  PROCESS_ID_KEY: f"proc{i}",
                  "successful_responses": succ, "failed_responses": fails,
                  "retry_attempts": retries,
                  "transport_starts": succ + fails + retries,
                  "reserved_attempts": succ + fails + retries,
                  "attempted_requests": succ + fails + retries,
                  "responses_received": succ + fails, "parse_successes": succ,
                  "pages_fetched": 1, "network_occurred": True})
          tot5 = combine_usage(five)
          assert tot5["successful_responses"] == 15, tot5["successful_responses"]
          assert tot5["failed_responses"] == 2, tot5["failed_responses"]
          assert tot5["retry_attempts"] == 4, tot5["retry_attempts"]
          assert tot5["prior_transport_starts"] == sum(
              e["transport_starts"] for e in five[:-1])
          assert validate_usage_accounting(tot5, entries=five,
                                           require_retry_identity=True) == []
          assert combine_usage(five) == tot5, "combining is not deterministic"

          # 12. Partial-unit recovery bookkeeping: recovered is a subset of
          #     completed and disjoint from every unresolved set.
          rec = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, state="completed",
              completed_identities=["u1", "u2"], recovered_identities=["u2"],
              process_usage=list(five), usage=tot5)
          p4 = tmp / "recovered.ckpt"
          write_checkpoint(p4, rec)
          loaded = load_checkpoint(p4)
          assert loaded.recovered_identities == ["u2"]
          assert loaded.usage["failed_responses"] == 2, "recovery erased a failure"

          print("checkpoint provenance verified from the installed wheel")
          PY
