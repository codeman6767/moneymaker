name: CI

# No secrets are used anywhere in this workflow.
#
# In particular the live `python -m sports_quant providers-check` is NOT run
# here: it requires a private Odds API key, and no API key belongs in GitHub
# Actions. Provider behaviour is covered by unit tests that use mocked HTTP
# transports (see `sports_quant/tests/`), so CI exercises the same code paths
# without any credential and without any outbound request.

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only checkout; this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff, mypy, pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy .

      - name: pytest
        run: python -m pytest -q

  wheel-smoke:
    name: Non-editable wheel install smoke (Python 3.11)
    runs-on: ubuntu-latest
    # A separate job that installs the BUILT WHEEL into a clean environment --
    # never an editable install -- so a missing package (e.g. sports_quant.matching)
    # or missing migration SQL fails here even though the editable `checks` job
    # would still pass. No secret is used and no outbound provider request is made.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel (no editable install)
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
          echo "Wheel contents:"
          python - "$RUNNER_TEMP/wheelhouse" <<'PY'
          import glob, sys, zipfile
          whl = glob.glob(f"{sys.argv[1]}/sports_quant-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          migs = sorted(n.split("/")[-1] for n in names if "/db/migrations/" in n and n.endswith(".sql"))
          assert "sports_quant/matching/sportsbook.py" in names, "matching package missing"
          assert len(migs) == 19 and migs[0] == "a001_core_entities.sql" and migs[-1] == "f019_retrospective_provenance_repairs.sql", migs
          assert {"e017_provider_identity.sql", "f018_retrospective_provenance.sql"} <= set(migs), migs
          assert not any("/tests/" in n for n in names), "tests packaged"
          assert not any(n.lower().endswith((".env", ".db")) for n in names), "secret/db packaged"
          print("wheel OK:", len(migs), "migrations, matching package present")
          PY

      - name: Install the wheel into a clean, non-editable environment
        run: |
          python -m venv "$RUNNER_TEMP/smokeenv"
          "$RUNNER_TEMP/smokeenv/bin/python" -m pip install --upgrade pip
          WHEEL="$(ls "$RUNNER_TEMP"/wheelhouse/sports_quant-*.whl)"
          "$RUNNER_TEMP/smokeenv/bin/python" -m pip install "$WHEEL"

      - name: Import, CLI, and db-init from the installed wheel (outside the source tree)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/smokeenv/bin/python"
          REPO="$GITHUB_WORKSPACE" "$PY" - <<'PY'
          import os
          import sports_quant, sports_quant.matching, sports_quant.matching.sportsbook, sports_quant.db.engine
          repo = os.path.abspath(os.environ["REPO"])
          for m in (sports_quant, sports_quant.matching, sports_quant.matching.sportsbook, sports_quant.db.engine):
              f = os.path.abspath(m.__file__)
              assert "site-packages" in f and not f.startswith(repo), f"{m.__name__} not from wheel: {f}"
          from sports_quant.db.engine import discover_migrations
          migs = discover_migrations()
          assert len(migs) == 19 and migs[-1].name == "f019_retrospective_provenance_repairs", (len(migs), migs[-1].name)
          print("imports + migrations resolve from the installed wheel")
          PY
          "$RUNNER_TEMP/smokeenv/bin/sports-quant" --help >/dev/null
          "$PY" -m sports_quant db-init --db "$RUNNER_TEMP/smoke.db" | tee /tmp/init1.txt
          "$PY" -m sports_quant db-init --db "$RUNNER_TEMP/smoke.db" | tee /tmp/init2.txt
          grep -q "Schema version: 19" /tmp/init1.txt
          grep -q "nothing was changed" /tmp/init2.txt

      - name: Checkpoint provenance from the installed wheel (offline, zero network)
        env:
          PYTHONPATH: ""
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/smokeenv/bin/python"
          "$PY" - <<'PY'
          """Legacy load, no-op resume, three-process accounting, partial resume.

          Runs against the WHEEL, outside the source tree, with a zero-network
          sentinel armed: any DNS/socket/httpx use fails the smoke test.
          """
          import json, os, socket, tempfile
          from pathlib import Path

          def _boom(*a, **k):
              raise AssertionError("wheel smoke attempted network access")
          socket.getaddrinfo = _boom
          socket.create_connection = _boom
          import httpx
          httpx.HTTPTransport.handle_request = _boom
          httpx.AsyncHTTPTransport.handle_async_request = _boom

          from sports_quant.db.schema import CURRENT_SCHEMA_VERSION
          assert CURRENT_SCHEMA_VERSION == 19, CURRENT_SCHEMA_VERSION

          from sports_quant.ingest.checkpoint import (
              CHECKPOINT_FORMAT_VERSION, LEGACY_CHECKPOINT_FORMAT_VERSION,
              Checkpoint, load_checkpoint, write_checkpoint)
          from sports_quant.usage_provenance import (
              USAGE_ACCOUNTING_VERSION, combine_usage, current_process_entry,
              validate_usage_accounting)

          tmp = Path(tempfile.mkdtemp())

          # 1. A legacy v1 checkpoint loads and keeps every fact it holds.
          v1 = {
              "checkpoint_format_version": LEGACY_CHECKPOINT_FORMAT_VERSION,
              "plan_version": "p", "manifest_hash": "h", "provider": "mlb_statsapi",
              "league": "mlb", "date_range": "2026-06-01..2026-06-30",
              "families": ["schedule"], "scratch_db": "s.db",
              "scratch_fingerprint": "FP", "schema_version": 17,
              "request_cap": 6002, "credit_cap": None,
              "completed_identities": ["u1"], "state": "completed",
              "usage": {"successful_responses": 1999, "failed_responses": 2,
                        "retry_attempts": 7, "transport_starts": 2008,
                        "reserved_attempts": 2008, "attempted_requests": 2008,
                        "responses_received": 2001, "parse_successes": 1999,
                        "pages_fetched": 401, "throttle_events": 1999,
                        "throttle_wait_seconds": 3407.8885556863097,
                        "families_completed": ["game", "skeleton"],
                        "network_occurred": True, "checkpoint_state": "completed"}}
          p1 = tmp / "legacy.ckpt"
          p1.write_text(json.dumps(v1), encoding="utf-8")
          before = p1.read_bytes()
          ck = load_checkpoint(p1)
          assert ck.checkpoint_format_version == LEGACY_CHECKPOINT_FORMAT_VERSION
          assert ck.legacy_migrated and not ck.process_count_known
          lg = ck.logical_usage()
          assert (lg["successful_responses"], lg["failed_responses"],
                  lg["retry_attempts"], lg["pages_fetched"]) == (1999, 2, 7, 401)
          assert p1.read_bytes() == before, "loading a v1 checkpoint mutated it"
          assert validate_usage_accounting(lg, request_cap=6002) == []

          # 2. A missing legacy counter stays missing (never a misleading zero).
          v1b = dict(v1); v1b["usage"] = {"successful_responses": 5}
          p1b = tmp / "sparse.ckpt"; p1b.write_text(json.dumps(v1b), encoding="utf-8")
          e = load_checkpoint(p1b).process_usage[0]
          assert e["successful_responses"] == 5 and "retry_attempts" not in e

          # 3. Three-process logical accounting: prior + current == total, once.
          procs = [
              {"reserved_attempts": 5, "attempted_requests": 5, "transport_starts": 5,
               "successful_responses": 2, "failed_responses": 2, "retry_attempts": 1,
               "responses_received": 2, "parse_successes": 2, "pages_fetched": 1,
               "network_occurred": True, "families_completed": ["schedule"]},
              {"reserved_attempts": 5, "attempted_requests": 5, "transport_starts": 5,
               "successful_responses": 2, "failed_responses": 1, "retry_attempts": 2,
               "responses_received": 2, "parse_successes": 2, "pages_fetched": 1,
               "network_occurred": True, "families_failed": ["schedule"]},
              {"reserved_attempts": 2, "attempted_requests": 2, "transport_starts": 2,
               "successful_responses": 2, "responses_received": 2,
               "parse_successes": 2, "pages_fetched": 1, "network_occurred": True,
               "checkpoint_state": "completed", "families_completed": ["schedule"]}]
          total = combine_usage(procs)
          assert total["successful_responses"] == 6
          assert total["failed_responses"] == 3, "a later process erased a failure"
          assert total["retry_attempts"] == 3
          assert total["reserved_attempts"] == 12
          assert total["prior_transport_starts"] == 10
          assert tuple(total["families_failed"]) == ("schedule",)
          assert validate_usage_accounting(total, request_cap=50, entries=procs) == []

          # 4. Repeated combination never multiplies prior usage.
          assert combine_usage(procs) == total

          # 5. The gate's prior pre-charge is not attributed to the new process.
          entry = current_process_entry(
              {"reserved_attempts": 30, "attempted_requests": 30,
               "prior_requests": 20, "reserved_credits": 8, "prior_credits": 5})
          assert entry["reserved_attempts"] == 10 and entry["reserved_credits"] == 3

          # 6. A v2 round trip carries the provenance block and refuses a lie.
          ck2 = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, process_usage=list(procs),
              usage=total, state="completed", completed_identities=["u1"])
          p2 = tmp / "v2.ckpt"
          write_checkpoint(p2, ck2)
          body = json.loads(p2.read_text(encoding="utf-8"))
          assert body["checkpoint_format_version"] == CHECKPOINT_FORMAT_VERSION
          assert body["usage_provenance"]["accounting_version"] == USAGE_ACCOUNTING_VERSION
          assert body["usage_provenance"]["process_count"] == 3
          reloaded = load_checkpoint(p2)
          assert reloaded.usage["failed_responses"] == 3
          assert reloaded.prior_usage()["successful_responses"] == 4
          assert reloaded.current_process_usage()["successful_responses"] == 2
          body["usage"]["successful_responses"] = 999
          p2.write_text(json.dumps(body), encoding="utf-8")
          try:
              load_checkpoint(p2)
          except Exception as exc:
              assert "inconsistent" in str(exc), exc
          else:
              raise AssertionError("a checkpoint contradicting its history was accepted")

          # 7. A completed state cannot coexist with an unresolved unit.
          bad = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, state="completed",
              completed_identities=["u1"], incomplete_identities=["u2"])
          p3 = tmp / "bad.ckpt"
          write_checkpoint(p3, bad)
          try:
              load_checkpoint(p3)
          except Exception as exc:
              assert "unresolved" in str(exc), exc
          else:
              raise AssertionError("a completed checkpoint with an unresolved unit loaded")

          # 8. Hostile value types and ranges are refused, not propagated.
          from sports_quant.usage_provenance import (
              LEGACY_PROCESS_ID, PROCESS_ID_KEY, UsageProvenanceError,
              sanitized_usage)
          for field, value in (("successful_responses", "1999"),
                               ("successful_responses", True),
                               ("failed_responses", -1),
                               ("throttle_wait_seconds", float("nan")),
                               ("throttle_wait_seconds", float("inf")),
                               ("pages_fetched", {"a": 1}),
                               ("network_occurred", 1),
                               ("families_completed", "schedule")):
              try:
                  sanitized_usage({field: value})
              except UsageProvenanceError:
                  pass
              else:
                  raise AssertionError(f"hostile {field}={value!r} was accepted")
          assert sanitized_usage({"successful_responses": 1, "api_key": "sk-x"}) == {
              "successful_responses": 1}, "an unknown key survived sanitization"

          # 9. An absent counter stays unknown; it never becomes a misleading zero.
          assert validate_usage_accounting({"successful_responses": 5}) == []
          assert validate_usage_accounting(
              {"successful_responses": 5, "transport_starts": 1})

          # 10. A legacy aggregate keeps its honest marker, and contradictory unit
          #     sets fail closed.
          assert load_checkpoint(p1).process_usage[0][PROCESS_ID_KEY] == LEGACY_PROCESS_ID
          for over, needle in (
                  ({"state": "failed", "failed_identities": ["u1"]}, "both completed"),
                  ({"recovered_identities": ["ghost"]}, "not completed")):
              body = dict(v1)
              body.update(over)
              pv = tmp / "sets.ckpt"
              pv.write_text(json.dumps(body), encoding="utf-8")
              try:
                  load_checkpoint(pv)
              except Exception as exc:
                  assert needle in str(exc), exc
              else:
                  raise AssertionError(f"contradictory unit sets accepted: {over}")

          # 11. FIVE-process logical accounting closes exactly, once per process.
          five = []
          for i in range(5):
              succ, fails, retries = i + 1, i % 2, i % 3
              five.append({
                  PROCESS_ID_KEY: f"proc{i}",
                  "successful_responses": succ, "failed_responses": fails,
                  "retry_attempts": retries,
                  "transport_starts": succ + fails + retries,
                  "reserved_attempts": succ + fails + retries,
                  "attempted_requests": succ + fails + retries,
                  "responses_received": succ + fails, "parse_successes": succ,
                  "pages_fetched": 1, "network_occurred": True})
          tot5 = combine_usage(five)
          assert tot5["successful_responses"] == 15, tot5["successful_responses"]
          assert tot5["failed_responses"] == 2, tot5["failed_responses"]
          assert tot5["retry_attempts"] == 4, tot5["retry_attempts"]
          assert tot5["prior_transport_starts"] == sum(
              e["transport_starts"] for e in five[:-1])
          assert validate_usage_accounting(tot5, entries=five,
                                           require_retry_identity=True) == []
          assert combine_usage(five) == tot5, "combining is not deterministic"

          # 12. Partial-unit recovery bookkeeping: recovered is a subset of
          #     completed and disjoint from every unresolved set.
          rec = Checkpoint(
              manifest_hash="h", plan_version="p", provider="mlb_statsapi",
              league="mlb", date_range="r", families=("schedule",),
              scratch_db="s.db", scratch_fingerprint="FP", schema_version=17,
              request_cap=50, credit_cap=None, state="completed",
              completed_identities=["u1", "u2"], recovered_identities=["u2"],
              process_usage=list(five), usage=tot5)
          p4 = tmp / "recovered.ckpt"
          write_checkpoint(p4, rec)
          loaded = load_checkpoint(p4)
          assert loaded.recovered_identities == ["u2"]
          assert loaded.usage["failed_responses"] == 2, "recovery erased a failure"

          print("checkpoint provenance verified from the installed wheel")
          PY
